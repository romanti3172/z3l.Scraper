name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # CI=true makes the tests run on net10.0 and net11.0
      - name: Build
        run: dotnet build -c Release

      # the browser for z3l.Scraper.Playwright.Tests; without it those tests are inconclusive
      - name: Install Chromium
        shell: pwsh
        run: tests/z3l.Scraper.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget
          path: artifacts/*

  # remote loaders through a real broker; the test job above has no broker and skips them
  rabbitmq:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: z3ltest
          RABBITMQ_DEFAULT_PASS: z3ltest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      Z3L_TEST_RABBITMQ: amqp://z3ltest:z3ltest@localhost:5672/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Test
        run: dotnet test tests/z3l.Scraper.RabbitMQ.Tests -c Release

  aot:
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # the sample targets net10.0 so that it runs on .NET 10 too; -f cannot change the framework of a project with one
      # (its restore does not see it), so the job writes the framework into the project
      - name: Native AOT publish of the sample on ${{ matrix.framework }}, failing on any trim or AOT warning
        shell: bash
        run: |
          sed -i 's|<TargetFramework>net10.0</TargetFramework>|<TargetFramework>${{ matrix.framework }}</TargetFramework>|' samples/QuickStart/QuickStart.csproj
          grep -q "<TargetFramework>${{ matrix.framework }}</TargetFramework>" samples/QuickStart/QuickStart.csproj
          dotnet publish samples/QuickStart -c Release -r linux-x64 -p:PublishAot=true -o aot 2>&1 | tee publish.log
          if grep -E "warning IL[0-9]+" publish.log; then exit 1; fi
          test -x aot/QuickStart
