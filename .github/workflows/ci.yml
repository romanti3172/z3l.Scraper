name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # CI=true makes the tests run on net9.0 and net10.0
      - name: Build
        run: dotnet build -c Release

      # the browser for z3l.Scraper.Playwright.Tests; without it those tests are inconclusive
      - name: Install Chromium
        shell: pwsh
        run: tests/z3l.Scraper.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget
          path: artifacts/*

  aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Native AOT publish of the sample, failing on any trim or AOT warning
        shell: bash
        run: |
          dotnet publish samples/QuickStart -c Release -r linux-x64 -p:PublishAot=true -o aot 2>&1 | tee publish.log
          if grep -E "warning IL[0-9]+" publish.log; then exit 1; fi
          test -x aot/QuickStart
